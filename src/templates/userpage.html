{% extends 'privateLayout.html' %}
{% block content %}

<div class="container">

  <div class="row">
    <h3 class="display-6">Welcome, {{usr}}</h3>
  </div>
  
  <h4>Today's tasks ({{ weekday }})</h4>
  <div class="row">
    <a href="dashboard">See all chores</a>
  </div>
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>Task</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody>
        {% for chore in chores %}
        <tr>
          <td>{{ chore[0] }}</td>
          <td>{{ chore[1] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</div>
{% endblock %}
