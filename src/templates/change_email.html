{% extends 'privateLayout.html' %}
{% block content %}
<div class="container">
  <div class="row">
    <h1>Change Email</h1>
  </div>
</div>
<div class="container">
  <div class="row">
    <form action="/changeEmail" method="POST" class="box">
      <div class="col-auto">
        <label for="alt_current_email" class="form-label">Current Email</label>
        <input name="current_email" type="email" class="form-control" id="alt_current_email">
      </div>
      <div class="col-auto">
        <label for="alt_old_email" class="form-label">New Email</label>
        <input name="new_email" type="email" class="form-control" id="alt_old_email">
      </div>
      <div class="col-auto">
        <label for="alt_email_pwd" class="form-label">Enter Password</label>
        <input name="password" type="password" class="form-control" id="alt_email_pwd">
      </div>
      <br/>
      <!-- Flash message -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
            <p>{{msg}}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">Confirm</button>
      </div>
      <input type="hidden" name="csrf_token" value = "{{ csrf_token() }}" />
    </form>
  </div>
</div>
{% endblock %}
