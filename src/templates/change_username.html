{% extends 'privateLayout.html' %}
{% block content %}
<div class="container">
  <div class="row">
    <h1>Change Username</h1>
  </div>
</div>
<div class="container">
  <div class="row">
    <form action="/changeUsername" method="POST" class="box">
      <div class="col-auto">
        <label for="alt_current_user" class="form-label">Current Username</label>
        <input name="current_user" type="text" class="form-control" id="alt_current_user">
      </div>
      <div class="col-auto">
        <label name="alt_old_user" class="form-label">New Username</label>
        <input name="new_user" type="text" class="form-control" id="alt_old_user">
      </div>
      <div class="col-auto">
        <label name="alt_user_pwd" class="form-label">Enter Password</label>
        <input name="password" type="password" class="form-control" id="alt_user_pwd">
      </div>
      <br/>
      <!-- Flash message -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
            <p>{{msg}}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">Submit</button>
      </div>
      <input type="hidden" name="csrf_token" value = "{{ csrf_token() }}" />
    </form>
  </div>
</div>
{% endblock %}
